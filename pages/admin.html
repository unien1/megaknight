<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Admin</title>

    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icon2.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/icon2.png">
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages.css" />
</head>

<body>

<header class="topbar">
  <div class="topbar__left">
    <button class="btn btn--ghost js-back" type="button">← Back</button>

    <button class="btn btn--ghost js-add-recipe" type="button" data-nav="admin.html">
      ADD RECIPE
    </button>

    <button class="btn btn--ghost js-logout" type="button">Logout</button>
  </div>

  <div class="topbar__center">
    <h1 class="brand">MEGAKNIGHT</h1>
  </div>

  <div class="topbar__right"></div>
</header>

<main class="main">
  <h1>Admin panel</h1>

<form id="addRecipeForm" class="admin-form" autocomplete="off">
  <input id="rTitle" type="text" placeholder="Recipe title" />

  <input id="rImage" type="text" placeholder="Image URL (optional). Example: https://...jpg" />
  <div class="form-row">
    <label class="form-field">
      <span class="form-label">Cooking time (minutes)</span>
      <input id="rTime" type="number" min="1" step="1" placeholder="15" />
    </label>

    <label class="form-field">
      <span class="form-label">Difficulty</span>
      <select id="rDifficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
  </div>

  <textarea id="rIngredients" rows="6" placeholder="Ingredients (one per line)"></textarea>

  <textarea id="rSteps" rows="7" placeholder="Steps (one per line)"></textarea>

  <button class="btn" type="submit">Save recipe</button>

  <div id="adminMsg" style="margin-top:10px;"></div>
</form>
</main>

<script src="../js/data/recipes.js"></script>
<script src="../js/data/app.js"></script>

</body>

</html>
