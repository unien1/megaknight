<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe</title>

    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icon2.png">
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages.css" />
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar__left">
                <button class="btn btn--ghost" data-nav="category.html?type=all">← Back</button>
            </div>
            <div class="topbar__center">
                <h1 class="brand">MEGAKNIGHT</h1>
            </div>
            <div class="topbar__right">
                <div class="icon-btn" aria-label="PROFILE" title="PROFILE" data-nav="login.html">👤</div>
            </div>
        </header>

        <div class="layout">
            <main class="main">

                <h2 id="recipeTitle" style="margin: 0 0 12px 0;"></h2>

                <div style="margin-bottom: 12px;">
                    <span id="recipeMeta"></span>
                </div>

                <div style="margin-bottom: 16px;">
                    <img id="recipeImage" alt="" style="max-width: 100%; border-radius: 12px;">
                </div>

                <h3>Ingredients</h3>
                <ul id="ingredientsList"></ul>

                <h3>Steps</h3>
                <ol id="stepsList"></ol>

                <div id="recipeError" style="margin-top:16px;"></div>
            </main>
        </div>
    </div>

    <!-- ВАЖНО: сначала данные, потом логика -->
    <script src="../js/data/recipes.js"></script>
    <script src="../js/data/app.js"></script>
</body>

</html>
